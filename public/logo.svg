<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="titaniumGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A8A29E" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090A0C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Frame -->
  <rect width="240" height="240" rx="44" fill="#090A0C" />
  <circle cx="120" cy="120" r="100" fill="url(#halo)" />
  <rect x="2" y="2" width="236" height="236" rx="42" stroke="url(#goldGradient)" stroke-opacity="0.3" stroke-width="2" />

  <!-- Geometric Architectural Diamond Coordinate System -->
  <path d="M120 28L212 120L120 212L28 120Z" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="1.5" />
  <path d="M120 44L196 120L120 196L44 120Z" stroke="#D4AF37" stroke-opacity="0.15" stroke-width="1" />
  <line x1="120" y1="20" x2="120" y2="220" stroke="#D4AF37" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="20" y1="120" x2="220" y2="120" stroke="#D4AF37" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Monolithic Architectural P + R Monogram Portal -->
  <!-- Left Pillar (P) -->
  <path d="M82 68V172" stroke="url(#titaniumGradient)" stroke-width="10" stroke-linecap="round" />
  <!-- P Arch (upper loop) -->
  <path d="M82 68H122C140.778 68 156 83.2223 156 102C156 120.778 140.778 136 122 136H82" stroke="url(#titaniumGradient)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Diagonal Cantilever (R) -->
  <path d="M112 132L156 172" stroke="url(#goldGradient)" stroke-width="10" stroke-linecap="round" />

  <!-- Horizontal Datum Line -->
  <line x1="68" y1="172" x2="172" y2="172" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />

  <!-- Celestial Coordinate Accents -->
  <circle cx="120" cy="28" r="4" fill="#F59E0B" />
  <circle cx="120" cy="212" r="4" fill="#F59E0B" />
  <circle cx="28" cy="120" r="3" fill="#D4AF37" />
  <circle cx="212" cy="120" r="3" fill="#D4AF37" />
</svg>
